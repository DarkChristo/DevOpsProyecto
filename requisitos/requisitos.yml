# Requisitos del SRS (IEEE 830) como código. Fuente única para validar y generar la trazabilidad.
# prueba: nombre de un método de tests/test_esquema.py (o null si aún no se automatiza).
# verificacion: automatica | revision (el cliente/profesora lo valida a mano)
funcionales:
  - {id: RF-01, nombre: Iniciar sesión, prioridad: Alta, historia: "Como dueña del negocio, quiero iniciar sesión para que solo yo vea la información.", criterios: ["Credenciales inválidas son rechazadas", "La sesión se cierra tras 10 min de inactividad"], prueba: null, verificacion: revision}
  - {id: RF-02, nombre: Navegar por el menú, prioridad: Media, historia: "Como dueña, quiero un menú sencillo para moverme entre formularios desde el celular.", criterios: ["Menú accesible desde celular y computador"], prueba: null, verificacion: revision}
  - {id: RF-03, nombre: Gestionar producto, prioridad: Alta, historia: "Como dueña, quiero registrar productos con categoría, presentación y precios para venderlos.", criterios: ["Cada producto tiene categoría y presentación", "Presentaciones distintas son productos separados"], prueba: test_rf03_producto_requiere_categoria, verificacion: automatica}
  - {id: RF-04, nombre: Gestionar proveedor, prioridad: Alta, historia: "Como dueña, quiero registrar proveedores con RUT, razón social y teléfono.", criterios: ["El RUT identifica de forma única al proveedor"], prueba: test_rf04_rut_unico, verificacion: automatica}
  - {id: RF-05, nombre: Gestionar pedido, prioridad: Alta, historia: "Como dueña, quiero registrar el pedido con su cotización para hacer seguimiento a la entrega.", criterios: ["El pedido guarda fecha estimada de entrega", "El detalle guarda cantidad, precio cotizado y precio acordado", "Se avisa si una entrega haría superar 30 unidades"], prueba: test_rf05_aviso_limite_30, verificacion: automatica}
  - {id: RF-06, nombre: Gestionar factura de compra, prioridad: Alta, historia: "Como dueña, quiero registrar la factura del proveedor para tener constancia de lo entregado.", criterios: ["La factura queda asociada a un pedido", "Guarda fecha de emisión y de recepción"], prueba: test_rf06_factura_requiere_pedido, verificacion: automatica}
  - {id: RF-07, nombre: Administrar mercancía recibida, prioridad: Alta, historia: "Como dueña, quiero que cada entrega sea un lote con su vencimiento para controlar la mercancía.", criterios: ["Cada lote guarda cantidad recibida y fecha de vencimiento"], prueba: test_rf07_lote_con_vencimiento, verificacion: automatica}
  - {id: RF-08, nombre: Administrar inventario, prioridad: Alta, historia: "Como dueña, quiero ver el stock actual y las alertas para saber qué reponer.", criterios: ["El stock es recibido menos salidas", "Se alertan lotes que vencen en máximo 5 días"], prueba: test_rf08_stock_derivado, verificacion: automatica}
  - {id: RF-09, nombre: Gestionar ventas, prioridad: Alta, historia: "Como dueña, quiero registrar la venta y que salga el lote más antiguo para no perder mercancía.", criterios: ["La salida respeta FIFO", "Cada venta registra el medio de pago", "Una línea de venta puede tomar de más de un lote"], prueba: test_rf09_fifo, verificacion: automatica}
  - {id: RF-10, nombre: Administrar pérdida, prioridad: Alta, historia: "Como dueña, quiero registrar la mercancía vencida y cuánto dinero perdí.", criterios: ["La pérdida se calcula con el precio de compra de lo desechado"], prueba: test_rf10_perdida_vencimiento, verificacion: automatica}
  - {id: RF-11, nombre: Generar reportes, prioridad: Media, historia: "Como dueña, quiero ver ventas del día, más vendidos, ganancia del mes y próximos a vencer.", criterios: ["Existe el reporte de próximos a vencer"], prueba: null, verificacion: revision}
no_funcionales:
  - {id: RNF-01, nombre: Rendimiento de transacciones, meta: "Registrar venta o entrada en menos de 2 s en el 95 % de los casos", verificacion: "medición de tiempos (prueba de carga)"}
  - {id: RNF-02, nombre: Rendimiento de consultas, meta: "Consultas y reportes en menos de 3 s en el 95 % de los casos", verificacion: "medición de tiempos"}
  - {id: RNF-03, nombre: Seguridad de acceso, meta: "Cierre de sesión tras 10 minutos de inactividad", verificacion: "prueba automática de sesión"}
  - {id: RNF-04, nombre: Fiabilidad, meta: "0 registros parciales por venta o entrada", verificacion: "prueba automática de transacciones"}
  - {id: RNF-05, nombre: Disponibilidad, meta: "Disponible al menos 12 horas al día", verificacion: "monitoreo de disponibilidad"}
  - {id: RNF-06, nombre: Mantenibilidad, meta: "1 revisión de la base de datos por mes", verificacion: "tarea programada y registro"}
